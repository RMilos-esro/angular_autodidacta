<!-- Property Binding sirve para asignar el valor de una variable de TS a una propiedad/atributo de HTML --> 
 <!-- especialmente para controlar atributos como src, disabled, href, clases, estilos-->

 <br>
 <img [src]="urlImagen" alt="Imagen de GTA San Andreas" />
 <button [disabled]="!estado">Botón</button>
