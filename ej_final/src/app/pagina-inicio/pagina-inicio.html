<div>
  <app-tarjeta-producto
    [nombreProducto]="'Nintendo Switch 2'"
    [precioProducto]="499.95"
    (botonClickado)="recibirMensaje($event)"
  ></app-tarjeta-producto>
  <app-tarjeta-producto
    [nombreProducto]="'PS5 Pro'"
    [precioProducto]="899.95"
    (botonClickado)="recibirMensaje($event)"
  ></app-tarjeta-producto>

  <app-tarjeta-producto
    [nombreProducto]="'XBox Series X'"
    [precioProducto]="599.95"
    (botonClickado)="recibirMensaje($event)"
  ></app-tarjeta-producto>
</div>
<ul>
  @for (producto of carrito.items(); track producto) {
    <li>
      {{ producto[0] }} -- {{ producto[1] }}$
      <button (click)="eliminarProducto(producto)">Eliminar</button>
    </li>
  } @empty {
    <li>No hay productos</li>
  }
  <li>
    <h1>Total: {{ carrito.total() }}$</h1>
  </li>
</ul>
